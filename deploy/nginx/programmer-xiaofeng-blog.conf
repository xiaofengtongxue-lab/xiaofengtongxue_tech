server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 43.138.176.186 _;
    root /var/www/programmer-xiaofeng-blog/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name xiaofengtongxue.com www.xiaofengtongxue.com;
    server_tokens off;
    return 301 https://www.xiaofengtongxue.com$request_uri;
}

