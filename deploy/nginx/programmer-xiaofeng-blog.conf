server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name xinge.ac.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/programmer-xiaofeng-blog-xinge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/programmer-xiaofeng-blog-xinge/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://www.xiaofengtongxue.com$request_uri;
}

